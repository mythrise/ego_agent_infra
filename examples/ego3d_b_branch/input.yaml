input:
  title: Ego3D B branch — calibrated head rig, bounded root residual, and wrist seam
  objective: >-
    Reduce camera-wearer global translation and orientation error without future leakage,
    then improve both wrist trees without degrading the frozen Full-59 local pose.
  baseline: >-
    Frozen C7 RTMW-conditioned G5 pipeline. Current official-val snapshot supplied by the
    operator: Full59 World MPJPE 275.57±5.86 mm, Root-relative 137.60±3.28 mm,
    PA-MPJPE 76.29±1.16 mm, Root ATE 0.1126±0.0014 m, Root SO(3) 51.31±2.08 deg.
    C6 MediaPipe remains a detector control: 292.25±44.00, 136.93±3.71,
    76.15±1.22 mm, 0.1161±0.0093 m, 55.06±5.90 deg respectively.
  proposal: >-
    Freeze OOF predictions and coordinate contracts. First explain fold heterogeneity,
    replace the optical-center-equals-head assumption with a calibrated head-camera SE(3),
    add bounded translation-only and rotation-only residuals before their joint composition,
    and only then introduce a confidence-gated wrist seam residual. Validate every component
    against identity, constant, detector, shuffled-observation, and held-out-wearer controls.
  core_code: examples/ego3d_b_branch/core/b_branch_core.py
  source_repository: https://github.com/mythrise/ego3d_wm_global
  requested_tier: detailed_proposal
  metrics:
    - full59_world_mpjpe_mm
    - full59_root_relative_mpjpe_mm
    - pa_mpjpe_mm
    - root_ate_m
    - root_so3_deg
    - left_wrist_world_mpjpe_mm
    - right_wrist_world_mpjpe_mm
    - per_take_win_rate
    - peak_gpu_memory_bytes
    - wall_clock_seconds
  folds: [0, 1, 2, 3, 4]
  seeds: [20260803, 20260804, 20260805]
  branches: []
  hierarchy:
    - name: B-DIAG — fold heterogeneity audit
      kind: diagnostic
      children:
        - name: B-DIAG-1 manifest and leakage identity
          kind: variant
          runnable: true
          hypothesis: Fold 4's gain is not caused by overlap, different preprocessing, or metric weighting.
        - name: B-DIAG-2 take-stratified error attribution
          kind: variant
          runnable: true
          hypothesis: Per-take camera motion, depth, visibility, and calibration covariates explain fold variance.
    - name: B-ROOT — camera-to-root decomposition
      kind: stage
      children:
        - name: translation t
          kind: factor
          children:
            - name: B0 frozen C7-G5 reproduction
              kind: variant
              runnable: true
              hypothesis: The supplied C7 headline and each fold are reproducible from immutable artifacts.
            - name: B1 robust head-camera SE3 calibration
              kind: variant
              runnable: true
              hypothesis: A train-only rig transform beats the zero optical-center head assumption.
            - name: B2 bounded translation residual
              kind: variant
              runnable: true
              hypothesis: A gravity-basis residual lowers Root ATE while rotation and local pose stay frozen.
        - name: rotation R
          kind: factor
          children:
            - name: B3 bounded gravity rotation residual
              kind: variant
              runnable: true
              hypothesis: A rotation-only residual lowers SO3 error without consuming target translation.
            - name: B4 joint SE3 composition
              kind: variant
              runnable: true
              hypothesis: Joint composition adds value beyond B2 and B3 independently.
    - name: B-WRIST — observable wrist hierarchy
      kind: stage
      children:
        - name: B5 wrist observability and seam audit
          kind: variant
          runnable: true
          hypothesis: Detector confidence and visibility identify where wrist residuals are estimable.
        - name: B6 confidence-gated shared wrist seam residual
          kind: variant
          runnable: true
          hypothesis: Moving body wrist and its hand tree together reduces wrist error without seam tearing.
        - name: B7 temporal hand local refinement
          kind: variant
          runnable: true
          hypothesis: Finger refinement helps only after the B6 wrist gate passes.
resource_plan:
  matrix_cells: 150
  folds: 5
  estimated_cpu_hours: 96
  estimated_gpu_hours: 120
  cpu_per_cell: 8
  gpu_per_cell: 1
  row_shards: 16
  checkpoint_interval_minutes: 20
  resume_supported: true
  shared_dataset_cache: true
  recomputes_fold_invariant_data: false
  concurrent_cells: 8
  global_phase_barrier: false
  validation_coupled_to_compute: false
  output_partition_key: cell_id/row_shard
  human_approved: false
