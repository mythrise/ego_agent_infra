[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egoagentos-researchops"
version = "0.1.0"
description = "Evidence-gated multi-agent ResearchOps control plane"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.111,<0.116",
  "psycopg[binary]>=3.2,<3.4",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "uvicorn[standard]>=0.30,<0.35",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<0.29",
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "ruff>=0.11,<0.15",
]

[project.scripts]
ego-polardb-preflight = "apps.api.polardb_preflight:main"
rxp-bench = "benchmarks.runner:main"
rxp = "protocols.rxp.cli:main"
ego-real-gpu-verify = "experiments.fashion_mnist_amp.verify:main"
ego-egolite-agentteam-live = "experiments.egolite_agentteam.run:main"
ego-egolite-agentteam-verify = "experiments.egolite_agentteam.verify:main"
ego-semifinal-bundle = "semifinal_acceptance.cli:main"
ego-research-compile = "apps.api.research_os.cli:main"

[tool.setuptools]
py-modules = ["worker_distribution"]

[tool.setuptools.packages.find]
include = [
  "apps.api",
  "apps.api.fixtures",
  "apps.api.migrations",
  "apps.api.migrations.postgres",
  "apps.api.trusted_memory",
  "apps.api.research_os",
  "apps.agentteams_bridge",
  "apps.agentteams_bridge.extensions",
  "apps.agentteams_bridge.migrations",
  "apps.agentteams_bridge.migrations.postgres",
  "benchmarks",
  "benchmarks.corpus",
  "benchmarks.corpus.v1",
  "benchmarks.profiles",
  "benchmarks.schemas",
  "benchmarks.secure_memory",
  "benchmarks.secure_memory.substrate",
  "benchmarks.secure_memory.schemas",
  "experiments",
  "experiments.fashion_mnist_amp",
  "integrations",
  "integrations.agentteams",
  "integrations.agentteams.scripts",
  "protocols",
  "protocols.rxp",
  "protocols.rxp.schemas",
  "semifinal_acceptance",
  "semifinal_acceptance.schemas",
  "skill_runtime",
  "skills",
  "skills.ablation-analyzer",
  "skills.dataset-manifest",
  "skills.dataset-manifest.scripts",
  "skills.evidence-gate",
  "skills.research-memory",
  "skills.research-plan",
  "skills.safe-experiment-runner",
]
namespaces = true

[tool.setuptools.package-data]
"apps.api" = [
  "fixtures/egolite-mcp-launch.yaml",
  "migrations/postgres/001_control_plane.sql",
  "migrations/postgres/002_ledger_boundaries.sql",
  "migrations/postgres/003_trusted_memory_core.sql",
  "migrations/postgres/004_decision_closure_bytes.sql",
]
"apps.agentteams_bridge" = [
  "migrations/postgres/001_bridge_control_plane.sql",
  "migrations/postgres/002_campaign_safety_attention.sql",
]
"benchmarks" = [
  "corpus/v1/scenario.schema.json",
  "corpus/v1/scenarios.json",
  "schemas/agentteams-rxp-trace-v1.schema.json",
]
"benchmarks.secure_memory" = [
  "schemas/campaign-event-v1.schema.json",
  "schemas/candidate-proposal-v1.schema.json",
  "schemas/channel-envelope-v2.schema.json",
  "schemas/checkpoint-v1.schema.json",
  "schemas/issued-budget-ticket-v1.schema.json",
  "schemas/model-request-v1.schema.json",
  "schemas/model-response-v1.schema.json",
  "schemas/run-manifest-v2.schema.json",
  "schemas/signed-task-lease-v1.schema.json",
  "schemas/ticket-template-v1.schema.json",
  "schemas/trusted-fact-v1.schema.json",
  "schemas/trusted-relation-v1.schema.json",
]
"integrations.agentteams" = [
  "agentteams-resources.yaml.tmpl",
  "attention-packet.schema.json",
  "blueprint.yaml",
  "campaign-envelope.schema.json",
  "guardian-decision.schema.json",
  "message-envelope.schema.json",
  "official-contract.lock.json",
  "result-envelope.schema.json",
  "safety-decision.schema.json",
  "scripts/verify_official_contract.py",
  "user-status-projection.schema.json",
]
"protocols.rxp" = [
  "schemas/rxp-decision-v1.schema.json",
  "schemas/rxp-evidence-v1.schema.json",
  "schemas/rxp-grant-v1.schema.json",
  "schemas/rxp-intent-v1.schema.json",
  "schemas/rxp-matrix-ledger-v1.schema.json",
  "schemas/rxp-matrix-plan-v1.schema.json",
  "schemas/rxp-receipt-v1.schema.json",
]
"semifinal_acceptance" = ["README.md", "schemas/semifinal-acceptance-v1.schema.json"]
"skills" = [
  "ablation-analyzer/SKILL.md",
  "ablation-analyzer/egoagentos.skill.yaml",
  "dataset-manifest/SKILL.md",
  "dataset-manifest/egoagentos.skill.yaml",
  "dataset-manifest/scripts/build_manifest.py",
  "evidence-gate/SKILL.md",
  "evidence-gate/egoagentos.skill.yaml",
  "research-memory/SKILL.md",
  "research-memory/egoagentos.skill.yaml",
  "research-plan/SKILL.md",
  "research-plan/egoagentos.skill.yaml",
  "safe-experiment-runner/SKILL.md",
  "safe-experiment-runner/egoagentos.skill.yaml",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests/api", "tests/agentteams", "tests/acceptance", "tests/benchmarks", "tests/experiments", "tests/memory", "tests/protocols", "tests/secure_memory", "tests/skills"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.mypy]
explicit_package_bases = true
