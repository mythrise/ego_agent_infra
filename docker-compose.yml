name: egoagentos-researchops

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${EGO_POSTGRES_DB:-egoagentos}
      POSTGRES_USER: ${EGO_POSTGRES_USER:-egoagentos_owner}
      POSTGRES_PASSWORD: ${EGO_POSTGRES_PASSWORD:?Set EGO_POSTGRES_PASSWORD in .env}
    volumes:
      - egoagentos-postgres:/var/lib/postgresql/data
    ports:
      - "${EGO_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  api-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command:
      - python
      - -c
      - >-
        import os; from apps.api.postgres_store import PostgresStore;
        PostgresStore(os.environ["EGO_DATABASE_URL"], migration_mode="apply")
    environment:
      EGO_DATABASE_URL: postgresql://${EGO_POSTGRES_USER:-egoagentos_owner}:${EGO_POSTGRES_PASSWORD:?Set EGO_POSTGRES_PASSWORD in .env}@postgres:5432/${EGO_POSTGRES_DB:-egoagentos}
      EGO_TENANT_ID: ${EGO_TENANT_ID:-local}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  api-security:
    image: postgres:16-alpine
    command: ["/bin/sh", "/opt/egoagentos-postgres/configure_runtime_login.sh"]
    environment:
      PGHOST: postgres
      POSTGRES_DB: ${EGO_POSTGRES_DB:-egoagentos}
      POSTGRES_USER: ${EGO_POSTGRES_USER:-egoagentos_owner}
      POSTGRES_PASSWORD: ${EGO_POSTGRES_PASSWORD:?Set EGO_POSTGRES_PASSWORD in .env}
      EGO_RUNTIME_USER: ${EGO_RUNTIME_USER:-egoagentos_api_runtime}
      EGO_RUNTIME_PASSWORD: ${EGO_RUNTIME_PASSWORD:?Set EGO_RUNTIME_PASSWORD in .env}
      EGO_RUNTIME_GROUP: egoagentos_runtime
      EGO_SECURITY_SQL: /opt/egoagentos-postgres/security_roles.sql
      EGO_PEER_RUNTIME_USER: ${EGO_AGENTTEAMS_RUNTIME_USER:-egoagentos_bridge_runtime_login}
      EGO_PEER_RUNTIME_PASSWORD: ${EGO_AGENTTEAMS_RUNTIME_PASSWORD:?Set EGO_AGENTTEAMS_RUNTIME_PASSWORD in .env}
    volumes:
      - ./deploy/postgres:/opt/egoagentos-postgres:ro
    depends_on:
      api-migrate:
        condition: service_completed_successfully
    restart: "no"
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      EGO_DATABASE_URL: postgresql://${EGO_RUNTIME_USER:-egoagentos_api_runtime}:${EGO_RUNTIME_PASSWORD:?Set EGO_RUNTIME_PASSWORD in .env}@postgres:5432/${EGO_POSTGRES_DB:-egoagentos}
      EGO_DATABASE_MIGRATION_MODE: verify
      EGO_TENANT_ID: ${EGO_TENANT_ID:-local}
      EGO_CORS_ORIGINS: http://localhost:4173,http://127.0.0.1:4173
      EGO_MCP_APPROVAL_HMAC_SECRET: ${EGO_MCP_APPROVAL_HMAC_SECRET:-}
      EGO_OPERATOR_KEY: ${EGO_OPERATOR_KEY:?Set EGO_OPERATOR_KEY in .env}
      EGO_OPERATOR_ID: ${EGO_OPERATOR_ID:-operator}
      EGO_ALLOW_UNAUTHENTICATED_DEMO: ${EGO_ALLOW_UNAUTHENTICATED_DEMO:-false}
      EGO_TRUSTED_MEMORY_SERVICE_TOKEN: ${EGO_TRUSTED_MEMORY_SERVICE_TOKEN:-}
      EGO_HICLAW_URL: ${EGO_HICLAW_URL:-}
      EGO_NACOS_URL: ${EGO_NACOS_URL:-}
      EGO_HIGRESS_URL: ${EGO_HIGRESS_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      api-security:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4173:80"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  agentteams-bridge-migrate:
    profiles: ["agentteams"]
    build:
      context: .
      dockerfile: apps/agentteams_bridge/Dockerfile
    command:
      - python
      - -c
      - >-
        import os; from apps.agentteams_bridge.postgres_store import PostgresBridgeStore;
        PostgresBridgeStore(os.environ["EGO_AGENTTEAMS_DATABASE_URL"], migration_mode="apply")
    environment:
      EGO_AGENTTEAMS_DATABASE_URL: postgresql://${EGO_POSTGRES_USER:-egoagentos_owner}:${EGO_POSTGRES_PASSWORD:?Set EGO_POSTGRES_PASSWORD in .env}@postgres:5432/${EGO_POSTGRES_DB:-egoagentos}
    depends_on:
      api-security:
        condition: service_completed_successfully
    restart: "no"
    security_opt:
      - no-new-privileges:true

  agentteams-bridge-security:
    profiles: ["agentteams"]
    image: postgres:16-alpine
    command: ["/bin/sh", "/opt/egoagentos-postgres/configure_runtime_login.sh"]
    environment:
      PGHOST: postgres
      POSTGRES_DB: ${EGO_POSTGRES_DB:-egoagentos}
      POSTGRES_USER: ${EGO_POSTGRES_USER:-egoagentos_owner}
      POSTGRES_PASSWORD: ${EGO_POSTGRES_PASSWORD:?Set EGO_POSTGRES_PASSWORD in .env}
      EGO_RUNTIME_USER: ${EGO_AGENTTEAMS_RUNTIME_USER:-egoagentos_bridge_runtime_login}
      EGO_RUNTIME_PASSWORD: ${EGO_AGENTTEAMS_RUNTIME_PASSWORD:?Set EGO_AGENTTEAMS_RUNTIME_PASSWORD in .env}
      EGO_RUNTIME_GROUP: egoagentos_bridge_runtime
      EGO_SECURITY_SQL: /opt/egoagentos-postgres/agentteams_bridge_security.sql
      EGO_PEER_RUNTIME_USER: ${EGO_RUNTIME_USER:-egoagentos_api_runtime}
      EGO_PEER_RUNTIME_PASSWORD: ${EGO_RUNTIME_PASSWORD:?Set EGO_RUNTIME_PASSWORD in .env}
    volumes:
      - ./deploy/postgres:/opt/egoagentos-postgres:ro
    depends_on:
      agentteams-bridge-migrate:
        condition: service_completed_successfully
    restart: "no"
    security_opt:
      - no-new-privileges:true

  agentteams-bridge:
    profiles: ["agentteams"]
    build:
      context: .
      dockerfile: apps/agentteams_bridge/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
      agentteams-bridge-security:
        condition: service_completed_successfully
    environment:
      EGO_API_URL: http://backend:8000
      EGO_AGENTTEAMS_DATABASE_URL: postgresql://${EGO_AGENTTEAMS_RUNTIME_USER:-egoagentos_bridge_runtime_login}:${EGO_AGENTTEAMS_RUNTIME_PASSWORD:?Set EGO_AGENTTEAMS_RUNTIME_PASSWORD in .env}@postgres:5432/${EGO_POSTGRES_DB:-egoagentos}
      EGO_AGENTTEAMS_MIGRATION_MODE: verify
      EGO_OPERATOR_KEY: ${EGO_OPERATOR_KEY:?Set EGO_OPERATOR_KEY in .env}
      EGO_AGENTTEAMS_BRIDGE_OPERATOR_KEY: ${EGO_AGENTTEAMS_BRIDGE_OPERATOR_KEY:?Set EGO_AGENTTEAMS_BRIDGE_OPERATOR_KEY in .env}
      EGO_TENANT_ID: ${EGO_TENANT_ID:-local}
      EGO_TRUSTED_MEMORY_SERVICE_TOKEN: ${EGO_TRUSTED_MEMORY_SERVICE_TOKEN:-}
      EGO_FOCUS_MEMORY_MODE: ${EGO_FOCUS_MEMORY_MODE:-disabled}
      EGO_FOCUS_MEMORY_TOKEN_BUDGET: ${EGO_FOCUS_MEMORY_TOKEN_BUDGET:-4000}
      EGO_FOCUS_MEMORY_MAX_ITEMS: ${EGO_FOCUS_MEMORY_MAX_ITEMS:-12}
      EGO_FOCUS_MEMORY_SOURCE_MAX_ITEMS: ${EGO_FOCUS_MEMORY_SOURCE_MAX_ITEMS:-64}
      EGO_FOCUS_MEMORY_SCAN_LIMIT: ${EGO_FOCUS_MEMORY_SCAN_LIMIT:-512}
      AGENTTEAMS_CONTROLLER_URL: ${AGENTTEAMS_CONTROLLER_URL:-http://host.docker.internal:18080}
      AGENTTEAMS_AUTH_TOKEN: ${AGENTTEAMS_AUTH_TOKEN:-}
      AGENTTEAMS_MATRIX_URL: ${AGENTTEAMS_MATRIX_URL:-http://host.docker.internal:18080}
      AGENTTEAMS_MATRIX_ACCESS_TOKEN: ${AGENTTEAMS_MATRIX_ACCESS_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8010:8010"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  egoagentos-postgres:
