name: egoagentos-researchops

services:
  agentteams-controller-proxy:
    profiles: ["agentteams"]
    image: python:3.11-slim
    command: ["python", "/opt/egoagentos/controller_proxy.py"]
    pull_policy: ${EGO_BASE_IMAGE_PULL_POLICY:-missing}
    environment:
      NO_PROXY: 127.0.0.1,localhost,agentteams-controller
      no_proxy: 127.0.0.1,localhost,agentteams-controller
    volumes:
      - ./deploy/agentteams/controller_proxy.py:/opt/egoagentos/controller_proxy.py:ro
    networks:
      - agentteams-official
    ports:
      - "127.0.0.1:${AGENTTEAMS_CONTROLLER_PORT:-18090}:8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${EGO_POSTGRES_DB:-egoagentos}
      POSTGRES_USER: ${EGO_POSTGRES_USER:-egoagentos_owner}
      POSTGRES_PASSWORD: ${EGO_POSTGRES_PASSWORD:?Set EGO_POSTGRES_PASSWORD in .env}
    volumes:
      - egoagentos-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${EGO_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  api-migrate:
    platform: linux/amd64
    image: egoagentos-local-api:latest
    pull_policy: never
    command:
      - python
      - -c
      - >-
        import os; from apps.api.postgres_store import PostgresStore;
        PostgresStore(os.environ["EGO_DATABASE_URL"], migration_mode="apply")
    environment:
      EGO_DATABASE_URL: ${EGO_NEXA_DATABASE_URL:-postgresql://${EGO_POSTGRES_USER:-egoagentos_owner}:${EGO_POSTGRES_PASSWORD:?Set EGO_POSTGRES_PASSWORD in .env}@postgres:5432/${EGO_POSTGRES_DB:-egoagentos}}
      EGO_TENANT_ID: ${EGO_TENANT_ID:-local}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  api-security:
    image: postgres:16-alpine
    command: ["/bin/sh", "/opt/egoagentos-postgres/configure_runtime_login.sh"]
    environment:
      PGHOST: postgres
      POSTGRES_DB: ${EGO_POSTGRES_DB:-egoagentos}
      POSTGRES_USER: ${EGO_POSTGRES_USER:-egoagentos_owner}
      POSTGRES_PASSWORD: ${EGO_POSTGRES_PASSWORD:?Set EGO_POSTGRES_PASSWORD in .env}
      EGO_RUNTIME_USER: ${EGO_RUNTIME_USER:-egoagentos_api_runtime}
      EGO_RUNTIME_PASSWORD: ${EGO_RUNTIME_PASSWORD:?Set EGO_RUNTIME_PASSWORD in .env}
      EGO_RUNTIME_GROUP: egoagentos_runtime
      EGO_SECURITY_SQL: /opt/egoagentos-postgres/security_roles.sql
      EGO_PEER_RUNTIME_USER: ${EGO_AGENTTEAMS_RUNTIME_USER:-egoagentos_bridge_runtime_login}
      EGO_PEER_RUNTIME_PASSWORD: ${EGO_AGENTTEAMS_RUNTIME_PASSWORD:?Set EGO_AGENTTEAMS_RUNTIME_PASSWORD in .env}
    volumes:
      - ./deploy/postgres:/opt/egoagentos-postgres:ro
    depends_on:
      api-migrate:
        condition: service_completed_successfully
    restart: "no"
    security_opt:
      - no-new-privileges:true

  api-storage-init:
    image: python:3.11-slim
    platform: linux/amd64
    pull_policy: ${EGO_BASE_IMAGE_PULL_POLICY:-missing}
    user: "0:0"
    command:
      - sh
      - -c
      - >-
        mkdir -p /var/lib/egoagentos/agent-memory /data/artifacts &&
        chown -R 100:101 /var/lib/egoagentos/agent-memory /data
    volumes:
      - egoagentos-agent-memory:/var/lib/egoagentos/agent-memory
      - egoagentos-artifacts:/data
    restart: "no"
    security_opt:
      - no-new-privileges:true

  backend:
    platform: linux/amd64
    image: egoagentos-local-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      EGO_DATABASE_URL: ${EGO_NEXA_DATABASE_URL:-postgresql://${EGO_RUNTIME_USER:-egoagentos_api_runtime}:${EGO_RUNTIME_PASSWORD:?Set EGO_RUNTIME_PASSWORD in .env}@postgres:5432/${EGO_POSTGRES_DB:-egoagentos}}
      EGO_NEXA_DATABASE_URL: ${EGO_NEXA_DATABASE_URL:-}
      EGO_DATABASE_MIGRATION_MODE: verify
      EGO_TENANT_ID: ${EGO_TENANT_ID:-local}
      EGO_CORS_ORIGINS: ${EGO_CORS_ORIGINS:-http://localhost:4173,http://127.0.0.1:4173}
      EGO_MCP_APPROVAL_HMAC_SECRET: ${EGO_MCP_APPROVAL_HMAC_SECRET:-}
      EGO_OPERATOR_KEY: ${EGO_OPERATOR_KEY:?Set EGO_OPERATOR_KEY in .env}
      EGO_OPERATOR_ID: ${EGO_OPERATOR_ID:-operator}
      EGO_ALLOW_UNAUTHENTICATED_DEMO: ${EGO_ALLOW_UNAUTHENTICATED_DEMO:-false}
      EGO_TRUSTED_MEMORY_SERVICE_TOKEN: ${EGO_TRUSTED_MEMORY_SERVICE_TOKEN:-}
      EGO_AGENT_MEMORY_ROOT: /var/lib/egoagentos/agent-memory
      TENCENT_AGENT_MEMORY_ENDPOINT: ${TENCENT_AGENT_MEMORY_ENDPOINT:-}
      TENCENT_AGENT_MEMORY_API_KEY: ${TENCENT_AGENT_MEMORY_API_KEY:-}
      TENCENT_AGENT_MEMORY_SERVICE_ID: ${TENCENT_AGENT_MEMORY_SERVICE_ID:-}
      TENCENT_AGENT_MEMORY_SPACE_ID: ${TENCENT_AGENT_MEMORY_SPACE_ID:-}
      EGO_HICLAW_URL: ${EGO_HICLAW_URL:-http://agentteams-bridge:8010/api/v1/agentteams/health?team=ego-researchops}
      EGO_NACOS_URL: ${EGO_NACOS_URL:-}
      EGO_HIGRESS_URL: ${EGO_HIGRESS_URL:-}
      EGO_AGENT_MODEL_BASE_URL: ${EGO_AGENT_MODEL_BASE_URL:-}
      EGO_AGENT_MODEL_API_KEY: ${EGO_AGENT_MODEL_API_KEY:-}
      EGO_AGENT_MODEL: ${EGO_AGENT_MODEL:-agnes-2.5-pro}
      EGO_ARTIFACT_ROOT: /data/artifacts
      NO_PROXY: 127.0.0.1,localhost,postgres,agentteams-controller
      no_proxy: 127.0.0.1,localhost,postgres,agentteams-controller
    volumes:
      - egoagentos-agent-memory:/var/lib/egoagentos/agent-memory
      - egoagentos-artifacts:/data
    depends_on:
      postgres:
        condition: service_healthy
      api-security:
        condition: service_completed_successfully
      api-storage-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${EGO_API_PORT:-8000}:8000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  web:
    image: python:3.11-slim
    platform: linux/amd64
    command: ["python", "/opt/egoagentos/local_server.py"]
    pull_policy: ${EGO_BASE_IMAGE_PULL_POLICY:-missing}
    environment:
      EGO_WEB_ROOT: /usr/share/egoagentos
      EGO_WEB_BACKEND_HOST: backend
      EGO_WEB_BACKEND_PORT: "8000"
      NO_PROXY: 127.0.0.1,localhost,backend
      no_proxy: 127.0.0.1,localhost,backend
    volumes:
      - ./apps/web/dist:/usr/share/egoagentos:ro
      - ./deploy/web/local_server.py:/opt/egoagentos/local_server.py:ro
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EGO_WEB_PORT:-4173}:80"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  agentteams-bridge-migrate:
    profiles: ["agentteams"]
    platform: linux/amd64
    image: egoagentos-local-agentteams-bridge:latest
    pull_policy: never
    command:
      - python
      - -c
      - >-
        import os; from apps.agentteams_bridge.postgres_store import PostgresBridgeStore;
        PostgresBridgeStore(os.environ["EGO_AGENTTEAMS_DATABASE_URL"], migration_mode="apply")
    environment:
      EGO_AGENTTEAMS_DATABASE_URL: ${EGO_NEXA_DATABASE_URL:-postgresql://${EGO_POSTGRES_USER:-egoagentos_owner}:${EGO_POSTGRES_PASSWORD:?Set EGO_POSTGRES_PASSWORD in .env}@postgres:5432/${EGO_POSTGRES_DB:-egoagentos}}
    depends_on:
      api-security:
        condition: service_completed_successfully
    restart: "no"
    security_opt:
      - no-new-privileges:true

  agentteams-bridge-security:
    profiles: ["agentteams"]
    image: postgres:16-alpine
    command: ["/bin/sh", "/opt/egoagentos-postgres/configure_runtime_login.sh"]
    environment:
      PGHOST: postgres
      POSTGRES_DB: ${EGO_POSTGRES_DB:-egoagentos}
      POSTGRES_USER: ${EGO_POSTGRES_USER:-egoagentos_owner}
      POSTGRES_PASSWORD: ${EGO_POSTGRES_PASSWORD:?Set EGO_POSTGRES_PASSWORD in .env}
      EGO_RUNTIME_USER: ${EGO_AGENTTEAMS_RUNTIME_USER:-egoagentos_bridge_runtime_login}
      EGO_RUNTIME_PASSWORD: ${EGO_AGENTTEAMS_RUNTIME_PASSWORD:?Set EGO_AGENTTEAMS_RUNTIME_PASSWORD in .env}
      EGO_RUNTIME_GROUP: egoagentos_bridge_runtime
      EGO_SECURITY_SQL: /opt/egoagentos-postgres/agentteams_bridge_security.sql
      EGO_PEER_RUNTIME_USER: ${EGO_RUNTIME_USER:-egoagentos_api_runtime}
      EGO_PEER_RUNTIME_PASSWORD: ${EGO_RUNTIME_PASSWORD:?Set EGO_RUNTIME_PASSWORD in .env}
    volumes:
      - ./deploy/postgres:/opt/egoagentos-postgres:ro
    depends_on:
      agentteams-bridge-migrate:
        condition: service_completed_successfully
    restart: "no"
    security_opt:
      - no-new-privileges:true

  agentteams-bridge:
    profiles: ["agentteams"]
    platform: linux/amd64
    image: egoagentos-local-agentteams-bridge:latest
    build:
      context: .
      dockerfile: apps/agentteams_bridge/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
      agentteams-bridge-security:
        condition: service_completed_successfully
    environment:
      EGO_API_URL: http://backend:8000
      EGO_AGENTTEAMS_DATABASE_URL: ${EGO_NEXA_DATABASE_URL:-postgresql://${EGO_AGENTTEAMS_RUNTIME_USER:-egoagentos_bridge_runtime_login}:${EGO_AGENTTEAMS_RUNTIME_PASSWORD:?Set EGO_AGENTTEAMS_RUNTIME_PASSWORD in .env}@postgres:5432/${EGO_POSTGRES_DB:-egoagentos}}
      EGO_AGENTTEAMS_MIGRATION_MODE: verify
      EGO_OPERATOR_KEY: ${EGO_OPERATOR_KEY:?Set EGO_OPERATOR_KEY in .env}
      EGO_AGENTTEAMS_BRIDGE_OPERATOR_KEY: ${EGO_AGENTTEAMS_BRIDGE_OPERATOR_KEY:?Set EGO_AGENTTEAMS_BRIDGE_OPERATOR_KEY in .env}
      EGO_TENANT_ID: ${EGO_TENANT_ID:-local}
      EGO_TRUSTED_MEMORY_SERVICE_TOKEN: ${EGO_TRUSTED_MEMORY_SERVICE_TOKEN:-}
      EGO_FOCUS_MEMORY_MODE: ${EGO_FOCUS_MEMORY_MODE:-disabled}
      EGO_FOCUS_MEMORY_TOKEN_BUDGET: ${EGO_FOCUS_MEMORY_TOKEN_BUDGET:-4000}
      EGO_FOCUS_MEMORY_MAX_ITEMS: ${EGO_FOCUS_MEMORY_MAX_ITEMS:-12}
      EGO_FOCUS_MEMORY_SOURCE_MAX_ITEMS: ${EGO_FOCUS_MEMORY_SOURCE_MAX_ITEMS:-64}
      EGO_FOCUS_MEMORY_SCAN_LIMIT: ${EGO_FOCUS_MEMORY_SCAN_LIMIT:-512}
      AGENTTEAMS_CONTROLLER_URL: ${AGENTTEAMS_CONTROLLER_URL:-http://host.docker.internal:18080}
      AGENTTEAMS_AUTH_TOKEN: ${AGENTTEAMS_AUTH_TOKEN:-}
      AGENTTEAMS_MATRIX_URL: ${AGENTTEAMS_MATRIX_URL:-http://host.docker.internal:18080}
      AGENTTEAMS_MATRIX_ACCESS_TOKEN: ${AGENTTEAMS_MATRIX_ACCESS_TOKEN:-}
      NO_PROXY: 127.0.0.1,localhost,backend,postgres,agentteams-controller
      no_proxy: 127.0.0.1,localhost,backend,postgres,agentteams-controller
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - agentteams-official
    ports:
      - "127.0.0.1:${EGO_AGENTTEAMS_BRIDGE_PORT:-8010}:8010"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  egoagentos-postgres:
  egoagentos-agent-memory:
  egoagentos-artifacts:

networks:
  agentteams-official:
    external: true
    name: agentteams-net
