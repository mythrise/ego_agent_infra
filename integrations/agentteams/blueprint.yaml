schema: egoagentos.agentteams-blueprint.v2
name: egoagentos-researchops
truth_boundary:
  live_requires:
    - official-controller-health
    - team-phase-active
    - team-leader-ready
    - all-worker-members-ready
    - matrix-event-id
    - controller-project-workflow
  dry_run_label: DRY_RUN_ONLY
official_contract:
  repository: https://github.com/agentscope-ai/AgentTeams
  stable_tag: v1.2.2
  stable_commit: 849182af8e017168a5a200a87b1062142caf462d
  main_commit: 223ddc2b8073e4c8b93bcbb15e1d717f196c04d9
  api_version: agentteams.io/v1beta1
control_plane:
  source_of_truth: egoagentos-api
  bridge: ../../apps/agentteams_bridge
collaboration_plane:
  resource: Team/ego-researchops
  team_leader: Worker/ego-research-lead
  manager: Manager/ego-manager
  transport: Matrix
  runtime_protocol: TeamHarness
state_mapping:
  AgentTeams:
    planned: pending
    assigned: delegated
    in_progress: in-progress
    submitted: in-progress
    completed: completed
    revision: revision
    blocked: blocked
    cancelled: blocked
  EgoAgentOS:
    CONTEXT: ego-scout
    PLAN: ego-architect
    PLAN_REVIEW: ego-reviewer
    APPROVAL: bridge-pause-and-human-r2
    EXECUTE: ego-runtime
    OBSERVE: ego-runtime
    EVALUATE: ego-evaluator
    VERIFY: ego-reviewer
    MEMORY_SKILL: ego-memory-curator
failure_semantics:
  conflict: result-envelope-or-agentteams-terminal-state
  replan: POST-/api/v1/projects/{id}/replan
  timeout: controller-task-cancel-plus-replacementTaskId
  resume: scoped-ego-r2-token-then-controller-resume
  compensation: pause-project-and-persist-recovery-checkpoint
observability:
  task_trace: agentteams.task.id
  project_trace: agentteams.project.id
  bridge_correlation: [task_id, project_id, trace_id, correlation_id, context_version]
  skill_evidence_levels: [DECLARED, SPAWN_AUTHORIZED, TOOL_INVOKED]
