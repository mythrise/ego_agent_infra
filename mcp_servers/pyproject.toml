[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "egoagentos-mcp-servers"
version = "0.1.0"
description = "Policy-enforced MCP v2 tool servers for the EgoAgentOS local ResearchOps demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.0.0",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.11,<0.15",
]

[project.scripts]
ego-repo-mcp = "egoagentos_mcp.repo_server:main"
ego-dataset-mcp = "egoagentos_mcp.dataset_server:main"
ego-gpu-mcp = "egoagentos_mcp.gpu_server:main"
ego-metrics-mcp = "egoagentos_mcp.metrics_server:main"
ego-workspace-mcp = "egoagentos_mcp.workspace_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
